spring:
  application:
    name: ex06
  datasource:
#    url: jdbc:mysql://localhost:3306/springdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  #    driver-class-name: com.mysql.cj.jdbc.Driver
  # data.sql 매번 실행해 달라..
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    # database 테이블 생성후 data.sql실행
    defer-datasource-initialization: true



